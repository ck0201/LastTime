<h1>Sign in</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="form" novalidate>
  <label>
    <span>Email</span>
    <input type="email" formControlName="email" autocomplete="email" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Enter your email.</small>
    }
  </label>

  <label>
    <span>Password</span>
    <input type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">Enter your password.</small>
    }
  </label>

  @if (error()) {
    <p class="notice notice-error">{{ error() }}</p>
  }

  <div class="actions">
    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
    <a class="btn" routerLink="/register">Create account</a>
  </div>
</form>
