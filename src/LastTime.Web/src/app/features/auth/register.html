<h1>Create account</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="form" novalidate>
  <label>
    <span>Email</span>
    <input type="email" formControlName="email" autocomplete="email" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Enter a valid email address.</small>
    }
  </label>

  <label>
    <span>Password <em class="muted">(at least 8 characters)</em></span>
    <div class="password-input-wrap">
      <input
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="new-password"
      />
      <button
        type="button"
        class="password-toggle"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        [attr.title]="showPassword() ? 'Hide password' : 'Show password'"
      >
        @if (showPassword()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    </div>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">Use 8 to 128 characters.</small>
    }
  </label>

  @if (error()) {
    <p class="notice notice-error">{{ error() }}</p>
  }

  <div class="actions">
    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create account' }}
    </button>
    <a class="btn" routerLink="/login">Sign in instead</a>
  </div>
</form>
